<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <title>Document</title>
</head>
<body>

<nav class="navbar bg-body-tertiary">
    <div class="container-fluid">
        <a class="row navbar-brand m-0">Сервис рассылок сообщения</a>
        <div class="d-flex">
            {% if user.is_authenticated %}
            <a class="pt-2 mb-0 me-2"
               href="/users/edit_user/{{user.pk}}/">Пользователь: {{user.email}}</a>
            <form action="{% url 'users:logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-success me-2">ВЫХОД</button>
            </form>
            {% else %}
            <a href="{% url 'users:login'%}" class="btn btn-outline-success me-2">ВХОД</a>
            <a href="{% url 'users:registration'%}" class="btn btn-outline-success me-2">РЕГИСТРАЦИЯ</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container">
    <div class="row">
        <div class="col-2 mt-2">
            {% include 'menu.html' %}
        </div>
        <div class="col-10">
            {% block content %} {% endblock %}
        </div>
    </div>
</div>

<div class="fixed-bottom">
    <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
        <div class="col-md-4 d-flex align-items-center">
            <a href="/" class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1">
                <svg class="bi" width="30" height="24">
                    <use xlink:href="#bootstrap"></use>
                </svg>
            </a>
            <span class="mb-3 mb-md-0 text-body-secondary">© 2025 Company, Inc</span>
        </div>

    </footer>
</div>

<script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
