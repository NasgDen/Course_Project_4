<!doctype html>
<html lang="rus">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/style.css">

</head>
<body>

    <div class="container center">
        <div class='header'>
                <H1 class="header_title"> Заголовок сайта</H1>
                <div class=buttonbox>
                    {% if user.is_authenticated %}
                                <a class="ms-3 my-0 mr-md-auto font-weight-normal text-decoration-none" href="/users/edit_user/{{user.pk}}/">Пользователь: {{user.email}}</a>
                        <form action="{% url 'users:logout' %}" method="post">
                             {% csrf_token %}
                        <button type="submit" class="btn btn-primary">ВЫХОД</button>
                        </form>
                    {% else %}
                        <a href="{% url 'users:login'%}" class="btn btn-primary">ВХОД</a>
                        <a href="{% url 'users:registration'%}" class="btn btn-primary">РЕГИСТРАЦИЯ</a>
                    {% endif %}
                </div>
        </div>
        <div class="side_menu">
            {% include 'menu.html' %}
        </div>

        <div class="main_area ">
            {% block content %} {% endblock %}
        </div>

        <div class='footer'>
            <H1> Футтер сайта</H1>
        </div>
    </div>

<script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
