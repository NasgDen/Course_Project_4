{% extends 'base.html' %}

{% block title %}Список Получателей{% endblock %}

{% block content %}

{% for message in messages %}
    {% if message.owner == user or manager %}
        <p class="content">Тема письма: {{message.subject}}</p>
        <p class="content">Текст письма: {{message.text}}</p>
        <a href="{% url 'message:message_detail' message.pk%}" class="btn btn_primery">Подробнее</a>
    {% endif %}
{% endfor %}

{% endblock %}
