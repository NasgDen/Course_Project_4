{% extends 'base.html' %}

{% block title %}Удаление {{distribution.recipients}}{% endblock %}

{% block content %}

<div class="container">
  <form method="post" enctype="multipart/form-data">
    <p>Вы действительно хотите удалить {{distribution.recipients}}?</p>
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'message:distribution_list' %}" class="btn btn-secondary">Отмена</a>
  </form>
</div>

{% endblock %}
