{% extends 'base.html' %}

{% block title %}Удаление {{recipient.full_name}}{% endblock %}

{% block content %}

<div class="container">
  <form method="post" enctype="multipart/form-data">
    <p>Вы действительно хотите удалить {{message.subject}}?</p>
    {% csrf_token %}
    <button type="submit" class="btn btn-outline-danger me-2">Удалить</button>
    <a href="{% url 'message:message_list' %}" class="btn btn-outline-primary me-2">Отмена</a>
  </form>
</div>

{% endblock %}
