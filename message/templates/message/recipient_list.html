{% extends 'base.html' %}

{% block title %}Список Получателей{% endblock %}

{% block content %}

{% for recipient in recipients %}

<a href="#"  class="content">EMAIL: {{recipient.email}}</a>
<p class="content">ФИО: {{recipient.full_name}}</p>
<p class="content">Коментарий: {{recipient.comment}}</p>
<a href="{% url 'message:recipient_update' recipient.pk%}" class="btn btn_primery">Изменить</a>
<a href="{% url 'message:recipient_delete' recipient.pk%}" class="btn btn_primery">Удалить</a>

{% endfor %}

{% endblock %}
