{% extends 'base.html' %}

{% block title %}Детальная игформация о Получателе{% endblock %}

{% block content %}

<p class="content">EMAIL: {{message.email}}</p>
<p class="content">ФИО: {{message.text}}</p>

<a href="{% url 'message:message_update' message.pk%}" class="btn btn_primery">Изменить</a>
<a href="{% url 'message:message_delete' message.pk%}" class="btn btn_primery">Удалить</a>
<a href="{% url 'message:message_list' %}" class="btn btn_primery">Назад</a>

{% endblock %}
